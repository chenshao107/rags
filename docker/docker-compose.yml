services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  rags:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${DOCS_PATH}:/data/docs:ro
      - ${RAGS_STATE:-./rags-state}:/srv/rags
    ports:
      - "${RAGS_PORT:-18787}:${RAGS_PORT:-18787}"
    restart: unless-stopped

volumes:
  qdrant_data:
