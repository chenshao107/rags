services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  rags:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCS_PATH: /data/docs
    volumes:
      - ${DOCS_PATH}:/data/docs
    ports:
      - "${RAGS_PORT:-18787}:${RAGS_PORT:-18787}"
    restart: unless-stopped

volumes:
  qdrant_data:
